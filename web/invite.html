<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>TeamBus invite</title>
<link rel="stylesheet" href="assets/pixel.css">
<style>
.stage{display:grid;place-items:center;padding:24px}
.invite{max-width:520px;width:100%;text-align:center;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:34px 28px}
.invite .hand{font:500 13px var(--px);color:var(--amber);letter-spacing:.1em;text-transform:uppercase;margin:12px 0 8px}
.invite h1{font:700 clamp(26px,5vw,38px)/1.1 var(--px);letter-spacing:.04em;margin:0 0 12px}
.invite p{color:var(--cream-2);margin:0 0 24px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
#err{display:block;color:var(--rose);border:0;background:none;padding:0;font:12px var(--mono);margin-top:16px;min-height:1em}
</style></head><body>
<div class="stage"><div class="invite">
 <div class="logo-big" id="logo"></div>
 <div class="hand">welcome</div>
 <h1>You've been invited to view TeamBus</h1>
 <p>You have read-only access to the team dashboard. You can look, but not change anything.</p>
 <div class="btns"><button class="btn pri" id="d">view dashboard</button><button class="btn pix" id="b">view brain</button></div>
 <div id="err" role="alert"></div>
</div></div>
<script src="assets/pixel.js"></script>
<script>
document.getElementById("logo").append(px.icon("rocket",5));

const t=new URLSearchParams(location.search).get("invite")||"";
const go=p=>()=>{location.href=p+"?invite="+encodeURIComponent(t)};
if(!t){document.getElementById("err").textContent="This link is missing its invite token.";d.disabled=b.disabled=true}
else{d.onclick=go("./");b.onclick=go("brain")}
</script></body></html>

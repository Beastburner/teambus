<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>TeamBus Memory</title>
<link rel="stylesheet" href="assets/pixel.css">
<style>
[hidden]{display:none!important}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin:14px 0}
.bar h1{font:700 clamp(26px,4vw,44px)/1 var(--px);letter-spacing:.07em;text-transform:uppercase;margin:0 10px 0 0}
.bar .grow{flex:1}
#upd{color:var(--mut);font:11px var(--mono)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{font:500 12px var(--px);letter-spacing:.03em;color:var(--cream);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.tbtn:hover{border-color:var(--cream)}.tbtn.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}.tbtn:disabled{opacity:.4;cursor:not-allowed}
.mem{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:14px;align-items:start}
@media(max-width:1100px){.mem{grid-template-columns:1fr}.pane-code{order:-1;height:72vh}.pane-tree{height:auto;max-height:300px;min-height:0}.side{order:2}.gctl{max-width:calc(100% - 56px)}}
.search{display:flex;gap:6px;align-items:center}.search input{flex:1;padding-right:10px}.search kbd{position:static}.qm{font:500 11px var(--px);color:var(--cream);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 10px;cursor:pointer;white-space:nowrap}.qm:hover{border-color:var(--cream)}
.hitrow{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px dashed var(--line-2);color:var(--cream-2);padding:7px 6px;cursor:pointer;font:11px/1.4 var(--mono)}.hitrow:hover{background:var(--chip)}.hitrow b{color:var(--cream);display:block;overflow-wrap:anywhere}.hitrow span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane{background:var(--ink-2);border:1px solid var(--line-2);border-radius:14px;min-width:0;display:flex;flex-direction:column}
.pane-tree{height:calc(100vh - 230px);min-height:360px}.pane-code{height:calc(100vh - 230px);min-height:360px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.search{margin:12px 12px 6px;position:relative}.search input{width:100%;background:var(--ink);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:8px 34px 8px 10px;font:12px var(--mono)}
.search kbd{position:absolute;right:8px;top:7px;font:11px var(--mono);color:var(--mut);border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
.tree{overflow:auto;padding:4px 6px 12px;flex:1;scrollbar-width:thin;scrollbar-color:var(--line) transparent;font:12px/1.3 var(--mono)}
.tree .row{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;color:var(--cream-2);padding:4px 6px;border-radius:5px;cursor:pointer;font:inherit;white-space:nowrap}
.tree .row:hover{background:var(--chip)}.tree .row.sel{background:var(--cream);color:var(--ink)}
.tree .row .nm{overflow:hidden;text-overflow:ellipsis;flex:1}.tree .dir{color:var(--cream)}
.tree .sub{margin-left:12px;border-left:1px dashed var(--line-2);padding-left:4px}
.tree .ag{width:8px;height:8px;flex:none}
.tree .more{color:var(--mut);padding:6px}
.cv-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px dashed var(--line-2)}
.cv-head b{font:500 14px var(--px);overflow-wrap:anywhere}.cv-head .m{font:11px var(--mono)}
.cv-head .sp{flex:1}
.banner{margin:10px 14px 0;padding:8px 12px;border:1px solid var(--amber);border-radius:8px;color:var(--amber);font-size:12px}
.code{display:flex;overflow:auto;flex:1;background:var(--ink);border-radius:0 0 14px 14px;font:12.5px/20px var(--mono);scrollbar-width:thin;scrollbar-color:var(--line) transparent;position:relative}
.code pre{margin:0;padding:10px 0;background:none;border:0;border-radius:0;max-height:none;overflow:visible;color:var(--cream);font:inherit;white-space:pre;tab-size:4}
.code .gut{position:sticky;left:0;background:var(--ink);color:var(--mut);text-align:right;padding:10px 10px 10px 12px;border-right:1px solid var(--line-2);user-select:none;z-index:1}
.code .src{padding:10px 18px 10px 14px;flex:1}
.code .hl{position:absolute;left:0;right:0;height:20px;background:rgba(94,230,216,.14);border-left:3px solid var(--neon);pointer-events:none}
.c{color:#8a8a72;font-style:italic}.s{color:#9ad47a}.k{color:#f0b24a}.n{color:#5ee6d8}
.empty-state{padding:34px 22px;text-align:center;color:var(--cream-2)}
.empty-state h3{font:700 20px var(--px);color:var(--cream);margin:0 0 10px}
.empty-state pre{display:inline-block;text-align:left;max-width:100%;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 4px}
.chip{font:11px var(--mono);border:1px solid var(--line-2);background:var(--chip);color:var(--cream);border-radius:5px;padding:3px 7px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip:hover{border-color:var(--cream)}
.side .card h2{margin-bottom:12px}.side .card{padding-bottom:14px}.kv{font:11px var(--mono);color:var(--mut);margin:8px 0 4px}
.mi{padding:7px 0;border-top:1px dashed var(--line-2);font-size:12px;overflow-wrap:anywhere}.mi:first-child{border:0}.mi b{color:var(--cream)}.mi .m{display:block}
/* graph */
.vtabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px dashed var(--line-2)}
.vtabs .sp{flex:1}.vtabs small{font:11px var(--mono);color:var(--mut)}
.tbtn.sm{padding:5px 10px;font-size:11px}
#gview{position:relative;flex:1;min-height:0;display:none;background:#101713;border-radius:0 0 14px 14px;overflow:hidden}
#gview.on{display:block}#cview{display:none;flex:1;min-height:0;flex-direction:column}#cview.on{display:flex}
#gc{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}#gc.drag{cursor:grabbing}#gc.hand{cursor:pointer}
.gctl{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;max-width:calc(100% - 20px)}
.gctl select{background:var(--ink);color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:5px 8px;font:11px var(--mono)}
.glegend{position:absolute;left:12px;bottom:10px;display:flex;gap:4px 12px;flex-wrap:wrap;font:10px var(--mono);color:var(--cream-2);z-index:2;pointer-events:none;max-width:70%}.glegend i{display:inline-block;width:8px;height:8px;margin-right:5px}
#gtip{position:absolute;pointer-events:none;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:11px/1.4 var(--mono);max-width:280px;overflow-wrap:anywhere;opacity:0;transition:opacity .1s;z-index:3}
.gzoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}.gzoom button{width:30px;height:30px;border:1px solid var(--line);background:var(--ink);color:var(--cream);border-radius:8px;cursor:pointer;font:500 15px var(--px)}.gzoom button:hover{background:var(--cream);color:var(--ink)}
.gmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--cream-2);text-align:center;padding:20px}
/* diagram modal */
#dm{position:fixed;inset:0;z-index:50;background:rgba(10,10,9,.84);display:flex;padding:min(3vw,28px)}#dm[hidden]{display:none}
.dwin{margin:auto;width:min(1500px,100%);height:100%;background:var(--ink);border:1px solid var(--cream);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 0 0 6px var(--slate)}
.dtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px dashed var(--line)}
.dtop h2{margin:0;border:0;background:var(--cream);color:var(--ink);border-radius:999px;padding:6px 16px}
.dtop select{background:var(--ink-2);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:12px var(--mono);max-width:320px}
.dnote{padding:8px 16px;color:var(--cream-2);font-size:12px;border-bottom:1px dashed var(--line-2)}
.dbody{flex:1;overflow:auto;padding:14px;background:#161615;border-radius:0 0 14px 14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.dbody svg{display:block;margin:0 auto}
.dmsg{padding:40px 20px;text-align:center;color:var(--cream-2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cream);color:var(--ink);font:500 12px var(--px);padding:9px 16px;border-radius:999px;z-index:80;opacity:0;pointer-events:none;transition:opacity .15s}#toast.on{opacity:1}
svg .nd{cursor:pointer}svg .nd:hover rect.box{stroke:#5ee6d8}
</style></head><body>
<div class="stage">
<header id="nav"></header>
<div class="bar"><h1>Memory</h1>
 <div class="tools" role="group" aria-label="Make a diagram">
  <button class="tbtn" data-d="flow" type="button" title="Which files import which">flow diagram</button>
  <button class="tbtn" data-d="sequence" type="button" title="Calls through the code, or agents talking">sequence</button>
  <button class="tbtn" data-d="er" type="button" title="Tables and how they relate">ER diagram</button>
  <button class="tbtn" data-d="classes" type="button" title="Classes and inheritance">classes</button>
  <a class="tbtn" id="pack" href="#" title="One Markdown file with every diagram, routes and table DDL">design pack</a>
 </div>
 <span class="grow"></span><span id="upd"></span></div>
<div id="err"></div>
<div class="mem">
 <div class="pane pane-tree">
  <div class="search"><input id="q" type="search" placeholder="find a file…" autocomplete="off" aria-label="Search"><button class="qm" id="qm" type="button" title="Switch between file names and text inside files">names</button></div>
  <div class="tree" id="tree" role="tree"></div>
 </div>
 <div class="pane pane-code" id="cpane">
  <div class="vtabs"><button class="tbtn on" id="tg" type="button">graph</button><button class="tbtn" id="tc" type="button">code</button><span class="sp"></span><small id="gstat"></small></div>
  <div id="gview"><canvas id="gc" aria-label="Map of files and how they connect. Drag nodes, scroll to zoom, click a node to open it."></canvas>
   <div class="gctl"><button class="tbtn sm on" data-e="import" type="button">imports</button><button class="tbtn sm on" data-e="link" type="button">doc links</button><button class="tbtn sm on" data-e="table" type="button">tables</button><button class="tbtn sm on" data-e="team" type="button" title="Files agents are editing together, and contracts">team</button><button class="tbtn sm on" id="gorph" type="button">orphans</button><button class="tbtn sm" id="glab" type="button">labels</button>
    <select id="gdepth" aria-label="Show"><option value="0">whole map</option><option value="1">selected + 1 hop</option><option value="2">selected + 2 hops</option></select></div>
   <div class="gzoom"><button id="gz+" type="button" aria-label="Zoom in">+</button><button id="gz-" type="button" aria-label="Zoom out">−</button><button id="gzf" type="button" aria-label="Fit">⟲</button></div>
   <div class="glegend" id="glegend"></div><div id="gtip"></div></div>
  <div id="cview"><div class="cv-head"><b id="cpath">Pick a file</b><span class="m" id="cmeta"></span><span class="sp"></span><button class="tbtn" id="cpy" type="button" hidden>copy code</button><button class="tbtn" id="cpp" type="button" hidden>copy path</button></div>
  <div id="banner" class="banner" hidden></div>
  <div class="code" id="code"><div class="empty-state" style="margin:auto"><h3>Your code, with the team on top</h3><p>Choose a file on the left. Coloured squares show which agent is working on it right now.</p></div></div>
  </div>
 </div>
 <div class="side">
  <section class="card" id="finfo"><h2>This file</h2><div id="finfob"><p class="empty">Nothing selected.</p></div></section>
  <section class="card"><h2>Team memory</h2><div id="tmem"></div></section>
 </div>
</div>
</div>
<div id="dm" role="dialog" aria-modal="true" aria-labelledby="dt" hidden>
 <div class="dwin">
  <div class="dtop"><h2 id="dt">Diagram</h2>
   <span id="dmode" class="tools" hidden><button class="tbtn on" data-m="calls" type="button">code calls</button><button class="tbtn" data-m="agents" type="button">agent messages</button></span>
   <select id="dentry" hidden aria-label="Start from"></select>
   <span style="flex:1"></span>
   <button class="tbtn" id="dz-" type="button" aria-label="Zoom out">−</button><button class="tbtn" id="dz+" type="button" aria-label="Zoom in">+</button><button class="tbtn" id="dzf" type="button">fit</button>
   <button class="tbtn" id="dmer" type="button">copy mermaid</button><button class="tbtn" id="dmmd" type="button">.mmd</button><button class="tbtn" id="dsvg" type="button">.svg</button>
   <button class="tbtn" id="dx" type="button">close</button></div>
  <div class="dnote" id="dnote"></div>
  <div class="dbody" id="dbody"></div>
 </div>
</div>
<div id="toast" role="status"></div>
<script src="assets/pixel.js"></script>
<script>
"use strict";
const Q = new URLSearchParams(location.search), token = Q.get("token") || "", invite = Q.get("invite") || "", $ = (id) => document.getElementById(id), NS = "http://www.w3.org/2000/svg";
const mk = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
px.nav("memory"); px.foot("read-only code view");
const hdr = token ? { Authorization: "Bearer " + token } : {};
async function api(path, params) {
  const u = new URL("api/" + path, location.href); for (const k in params || {}) u.searchParams.set(k, params[k]); if (!token && invite) u.searchParams.set("invite", invite);
  const r = await fetch(u, { headers: hdr }); let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw Object.assign(new Error((j && j.error) || "hub returned " + r.status), { status: r.status, body: j }); return j;
}
const toast = (m) => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 1600); };
const copy = async (text, msg) => { try { await navigator.clipboard.writeText(text); } catch (e) { const a = mk("textarea"); a.value = text; document.body.append(a); a.select(); document.execCommand("copy"); a.remove(); } toast(msg || "copied"); };
const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const col = (a) => `hsl(${hue(a)} 62% 68%)`;
const fmtSize = (n) => n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : n > 1e3 ? (n / 1e3).toFixed(1) + " KB" : n + " B";

let FILES = [], STATUS = null, SUMMARY = null, current = null, openDirs = new Set([""]), SETUP = null;
const q = $("q");

/* ---------- activity: which agent is on which file ---------- */
function activity() {
  const m = new Map();
  for (const i of (STATUS && STATUS.intents) || []) { let fs = []; try { fs = JSON.parse(i.files || "[]"); } catch (e) {} for (const f of fs) { const k = f.replace(/^\.?\//, ""); (m.get(k) || m.set(k, []).get(k)).push({ agent: i.agent_id, summary: i.summary || "" }); } }
  return m;
}
const ACT = { m: new Map() };
const actFor = (path) => { for (const [k, v] of ACT.m) if (path === k || path.endsWith("/" + k) || k.endsWith("/" + path)) return v; return null; };

/* ---------- file tree ---------- */
function buildTree(files) { const root = { dirs: new Map(), files: [] }; for (const f of files) { const parts = f.path.split("/"); let n = root; for (let i = 0; i < parts.length - 1; i++) { if (!n.dirs.has(parts[i])) n.dirs.set(parts[i], { dirs: new Map(), files: [] }); n = n.dirs.get(parts[i]); } n.files.push(f); } return root; }
function rowFor(f, label) {
  const b = mk("button", "row" + (current === f.path ? " sel" : "")); b.type = "button"; b.setAttribute("role", "treeitem"); b.title = f.path;
  const a = actFor(f.path); if (a) { const d = mk("span", "ag"); d.style.background = col(a[0].agent); d.title = a.map((x) => x.agent).join(", ") + " is working here"; b.append(d); }
  b.append(mk("span", "nm", label || f.path.split("/").pop())); b.onclick = () => openFile(f.path); return b;
}
function renderTree() {
  const host = $("tree"); host.replaceChildren(); const term = q.value.trim().toLowerCase();
  if (term) {
    const hit = FILES.filter((f) => f.path.toLowerCase().includes(term)); for (const f of hit.slice(0, 200)) host.append(rowFor(f, f.path));
    if (!hit.length) host.append(mk("div", "more", "No file matches.")); else if (hit.length > 200) host.append(mk("div", "more", `${hit.length - 200} more, keep typing`)); return;
  }
  const walk = (node, path, into) => {
    for (const [name, sub] of [...node.dirs].sort((a, b) => a[0].localeCompare(b[0]))) {
      const p = path ? path + "/" + name : name, open = openDirs.has(p), b = mk("button", "row dir"); b.type = "button"; b.setAttribute("role", "treeitem"); b.setAttribute("aria-expanded", open);
      b.append(mk("span", "", open ? "▾" : "▸"), mk("span", "nm", name + "/")); b.onclick = () => { open ? openDirs.delete(p) : openDirs.add(p); renderTree(); }; into.append(b);
      if (open) { const w = mk("div", "sub"); walk(sub, p, w); into.append(w); }
    }
    for (const f of node.files.sort((a, b) => a.path.localeCompare(b.path))) into.append(rowFor(f));
  };
  walk(buildTree(FILES), "", host);
}
let qmode = "names";
q.oninput = () => { if (qmode === "names") renderTree(); else if (!q.value.trim()) renderTree(); };
$("qm").onclick = () => { qmode = qmode === "names" ? "text" : "names"; $("qm").textContent = qmode === "names" ? "names" : "in code"; q.placeholder = qmode === "names" ? "find a file…" : "search inside files, Enter…"; q.focus(); renderTree(); };
async function textSearch(term) {
  const host = $("tree"); host.replaceChildren(mk("div", "more", "Searching…"));
  try { const d = await api("code/search", { q: term }); host.replaceChildren(); if (!d.results.length) host.append(mk("div", "more", "No matches.")); for (const h of d.results) { const b = mk("button", "hitrow"); b.type = "button"; b.append(mk("b", "", h.path + ":" + h.line), mk("span", "", h.text)); b.onclick = () => openFile(h.path, h.line); host.append(b); } if (d.capped) host.append(mk("div", "more", "More matches exist, narrow the search.")); }
  catch (e) { host.replaceChildren(mk("div", "more", e.message)); }
}
q.addEventListener("keydown", (e) => { if (e.key !== "Enter") return; const t = q.value.trim(); if (!t) return; if (qmode === "text") textSearch(t); else { const hit = FILES.find((f) => f.path.toLowerCase().includes(t.toLowerCase())); if (hit) openFile(hit.path); } });
px.keys([["/", "search files"], ["Enter", "open the first match / run a text search"], ["g", "graph view"], ["c", "code view"], ["Esc", "close a diagram or clear search"]]);
addEventListener("keydown", (e) => { if (!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $("dm").hidden) { if (e.key === "g") showTab("graph"); else if (e.key === "c") showTab("code"); } if (e.key === "/" && document.activeElement !== q && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); } if (e.key === "Escape") { if (!$("dm").hidden) closeDiagram(); else if (document.activeElement === q) { q.value = ""; renderTree(); q.blur(); } } });

/* ---------- code view with light highlighting ---------- */
const KW = { py: "def class return if elif else for while import from as with try except finally raise yield lambda pass break continue and or not in is None True False async await global nonlocal assert del",
  js: "function const let var return if else for while import export from default class extends new this try catch finally throw async await switch case break continue typeof instanceof null undefined true false of in yield static interface type enum",
  sql: "select from where insert into values update set delete create table if not exists primary key references foreign integer text real blob null default and or join left on group by order limit alter add column index unique",
  sh: "if then else fi for do done case esac function echo export local return in while" };
const RX = {};
function rxFor(l) {
  if (RX[l] !== undefined) return RX[l];
  const kw = KW[l]; if (!kw) return (RX[l] = null);
  const cm = { py: "#[^\\n]*", sh: "#[^\\n]*", sql: "--[^\\n]*", js: "\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/" }[l];
  const st = { py: "\"\"\"[\\s\\S]*?\"\"\"|'''[\\s\\S]*?'''|\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*'", js: "`(?:\\\\.|[^`\\\\])*`|\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*'" }[l] || "\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*'";
  return (RX[l] = new RegExp(`(${cm})|(${st})|\\b(${kw.split(" ").join("|")})\\b|(\\b\\d+(?:\\.\\d+)?\\b)`, l === "sql" ? "gi" : "g"));
}
function highlight(text, lang) {
  const l = lang === "python" ? "py" : lang === "javascript" || lang === "typescript" ? "js" : lang === "sql" ? "sql" : lang === "shell" ? "sh" : "", frag = document.createDocumentFragment(), rx = rxFor(l);
  if (!rx || text.length > 150000) { frag.append(document.createTextNode(text)); return frag; }
  rx.lastIndex = 0; let last = 0, m;
  while ((m = rx.exec(text))) {
    if (m.index > last) frag.append(document.createTextNode(text.slice(last, m.index)));
    const cls = m[1] != null ? "c" : m[2] != null ? "s" : m[3] != null ? "k" : "n"; frag.append(mk("span", cls, m[0])); last = rx.lastIndex; if (m[0] === "") rx.lastIndex++;
  }
  frag.append(document.createTextNode(text.slice(last))); return frag;
}
let lineHL = null;
function gotoLine(n) {
  const box = $("code"); if (!n) return; box.scrollTop = Math.max(0, (n - 1) * 20 - 80);
  if (lineHL) lineHL.remove(); lineHL = mk("div", "hl"); lineHL.style.top = 10 + (n - 1) * 20 + "px"; box.append(lineHL); setTimeout(() => lineHL && lineHL.remove(), 2600);
}

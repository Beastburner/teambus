name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      # hub + hooks + CLI + git hook (test_teambus.py) and the public sandbox: isolation, limits, expiry, proxy headers (test_sandbox.py)
      - run: pytest -q test_teambus.py test_sandbox.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the hub image (Dockerfile) and the sandbox image (Dockerfile.sandbox, what Render builds)
        run: |
          docker build -t teambus-hub:ci .
          docker build -f Dockerfile.sandbox -t teambus-sandbox:ci .
      - name: Smoke test the sandbox image exactly as Render runs it (no command override, PORT injected)
        run: |
          docker run -d --name sbx -p 10000:10000 -e PORT=10000 teambus-sandbox:ci
          for i in $(seq 1 40); do curl -fs localhost:10000/healthz && break; sleep 1; done
          curl -fs localhost:10000/healthz
          curl -fs -o /dev/null -w "landing page %{http_code}\n" localhost:10000/
          curl -fs -o /dev/null -w "font %{content_type}\n" localhost:10000/assets/InstrumentSerif-Regular.woff2
          curl -fs -X POST -o /dev/null -w "create sandbox %{http_code}\n" localhost:10000/new
          docker rm -f sbx
      - name: The default image on Render (RENDER set, no auth) starts the sandbox, and elsewhere the hub still refuses without auth
        run: |
          docker run -d --name onrender -p 10001:10000 -e RENDER=true -e PORT=10000 teambus-hub:ci
          for i in $(seq 1 40); do curl -fs localhost:10001/healthz && break; sleep 1; done
          body=$(curl -fs localhost:10001/healthz); echo "$body"; echo "$body" | grep -q '"sandboxes"'
          docker rm -f onrender
          out=$(docker run --rm teambus-hub:ci 2>&1 || true)       # the hub exits 1 here by design
          echo "$out"; echo "$out" | grep -q "refusing to start without auth"
          echo "hub refuses without auth: ok"
